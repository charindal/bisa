server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: fingerprinted by Vite, safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API: same-origin, proxied to the api container so the SPA can use relative URLs
    # and the httpOnly refresh cookie is sent without any CORS configuration.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths resolve to index.html so React Router can handle them.
    location / {
        try_files $uri /index.html;
    }
}
