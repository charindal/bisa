spring:
  jpa:
    show-sql: true

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  jwt:
    # Dev-only fallback secret so the app boots without extra setup. Never used in prod (enforced in JwtService).
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-min-32-bytes}
  bootstrap:
    super-admin-email: ${SUPER_ADMIN_EMAIL:admin@bisa.local}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:ChangeMe123!}

logging:
  level:
    com.bisa.sis: DEBUG
