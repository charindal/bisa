name: Build and Deploy to VPS

# Mirrors the buildtrac project's pipeline shape: push-triggered (no tag/approval gate),
# dev VPS tracks `develop`, production VPS tracks `main`. Both lanes git-clone/pull the repo
# directly onto the VPS and write .env from GitHub secrets on every deploy.
#
# Dev and prod share one VPS (same convention as the buildtrac/nactech/tvyako/zimdeal
# projects already on this host) — separated by deploy directory ($HOME/bisa vs /opt/bisa)
# and port (8092/8094 vs 8082/8084), not by host.
#
# Requires these repository secrets before deploy-dev / deploy-prod can run:
#   VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_PORT (optional, default 22)
#   DEV_POSTGRES_PASSWORD, DEV_JWT_SECRET, DEV_SUPER_ADMIN_EMAIL, DEV_SUPER_ADMIN_PASSWORD
#   PROD_POSTGRES_PASSWORD, PROD_JWT_SECRET, PROD_SUPER_ADMIN_EMAIL, PROD_SUPER_ADMIN_PASSWORD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ========================
  # Backend tests
  # ========================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bisa_sis
          POSTGRES_PASSWORD: bisa_sis
          POSTGRES_DB: bisa_sis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bisa_sis -d bisa_sis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/bisa_sis
          DB_USERNAME: bisa_sis
          DB_PASSWORD: bisa_sis
          JWT_SECRET: ci-test-secret-not-for-production-use-only-32bytes
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  # ========================
  # Frontend typecheck + build
  # ========================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: ./frontend
        run: npm ci

      - working-directory: ./frontend
        run: npm run build

  # ========================
  # Build and push Docker images
  # ========================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: lower
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.repository }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.repository }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

  # ========================
  # Deploy to dev VPS (develop branch)
  # ========================
  deploy-dev:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "Starting dev deployment from develop branch..."

            REPO="${{ github.repository }}"
            REPO_LOWER="${REPO,,}"
            APP_DIR="$HOME/bisa"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First run — cloning into $APP_DIR..."
              rm -rf "$APP_DIR"
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git
            git fetch origin
            git checkout develop 2>/dev/null || git checkout -b develop origin/develop
            git pull origin develop

            echo "Writing .env..."
            # Ports/project-name chosen to avoid colliding with other projects already on this VPS
            # (buildtrac: 80/8080/9090, nactech: 4001, tvyako: 4003, zimdeal: 5090) and to keep
            # dev isolated by Compose project name from a prod stack that might share the host.
            cat > "$APP_DIR/.env" << ENVEOF
            COMPOSE_PROJECT_NAME=bisa-dev
            POSTGRES_DB=bisa_sis
            POSTGRES_USER=bisa_sis
            POSTGRES_PASSWORD=${{ secrets.DEV_POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            SUPER_ADMIN_EMAIL=${{ secrets.DEV_SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.DEV_SUPER_ADMIN_PASSWORD }}
            COOKIE_SECURE=true
            SPRING_PROFILES_ACTIVE=prod
            API_IMAGE=ghcr.io/${REPO_LOWER}-backend
            WEB_IMAGE=ghcr.io/${REPO_LOWER}-frontend
            IMAGE_TAG=develop
            API_PORT=8092
            WEB_PORT=8094
            ENVEOF

            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling and starting containers..."
            docker compose pull
            docker compose up -d

            echo "Cleaning up dangling images..."
            docker image prune -f || true

            echo "Dev deployment completed."
            docker compose ps

  # ========================
  # Deploy to production VPS (main branch)
  # ========================
  deploy-prod:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "Starting production deployment from main branch..."

            REPO="${{ github.repository }}"
            REPO_LOWER="${REPO,,}"
            # /opt/bisa (not $HOME) to match this VPS's production convention used by other
            # projects (e.g. buildtrac). The deploy user needs write access to /opt/bisa —
            # pre-create it with the right ownership before the first deploy:
            #   sudo mkdir -p /opt/bisa && sudo chown $DEPLOY_USER:$DEPLOY_USER /opt/bisa
            APP_DIR="/opt/bisa"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First run — cloning into $APP_DIR..."
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git
            git fetch origin
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git pull origin main

            echo "Writing .env..."
            # Distinct port/project-name from the dev lane (8092/8094, bisa-dev) in case dev and
            # prod ever end up on the same VPS, plus the other projects already running here
            # (buildtrac: 80/8080/9090, nactech: 4001, tvyako: 4003, zimdeal: 5090).
            cat > "$APP_DIR/.env" << ENVEOF
            COMPOSE_PROJECT_NAME=bisa-prod
            POSTGRES_DB=bisa_sis
            POSTGRES_USER=bisa_sis
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            SUPER_ADMIN_EMAIL=${{ secrets.PROD_SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.PROD_SUPER_ADMIN_PASSWORD }}
            COOKIE_SECURE=true
            SPRING_PROFILES_ACTIVE=prod
            API_IMAGE=ghcr.io/${REPO_LOWER}-backend
            WEB_IMAGE=ghcr.io/${REPO_LOWER}-frontend
            IMAGE_TAG=latest
            API_PORT=8082
            WEB_PORT=8084
            ENVEOF

            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling and starting containers..."
            docker compose pull
            docker compose up -d

            echo "Waiting for health checks..."
            sleep 15

            if docker compose ps | grep -q "unhealthy"; then
              echo "Health check failed!"
              docker compose logs
              exit 1
            fi

            echo "Cleaning up dangling images..."
            docker image prune -f || true

            echo "Production deployment completed."
            docker compose ps
