# Local development: brings up only Postgres. Run the backend with `mvn spring-boot:run`
# and the frontend with `npm run dev` for fast reload — see backend/README / frontend/README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bisa_sis
      POSTGRES_USER: bisa_sis
      POSTGRES_PASSWORD: bisa_sis
    ports:
      - "5432:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisa_sis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_db_data:
